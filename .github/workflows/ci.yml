name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks on ${{ matrix.os }} (Node 24)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Use HTTPS for GitHub dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Check package contents
        run: npm pack --dry-run

  integration:
    name: Lumine integration specs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LUMINE_JASMINE_REPORTER: list
    steps:
      - uses: actions/checkout@v7
        with:
          path: ide-sofistik
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/lumine
          path: lumine
      - uses: actions/setup-node@v7
        with:
          node-version-file: lumine/.nvmrc
          cache: npm
          cache-dependency-path: lumine/package-lock.json
      - name: Install Linux build and headless-display dependencies
        run: |
          # The Azure HTTP mirror can stall before any integration specs run.
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$apt_source" ]; then
              sudo sed -i -E 's|https?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update || true
          sudo apt-get "${apt_options[@]}" install -y xvfb libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Use HTTPS for GitHub dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install package dependencies
        working-directory: ide-sofistik
        run: npm ci --ignore-scripts
      - name: Install declared spec packages
        run: node lumine/script/install-spec-packages.js --package ide-sofistik --home "$RUNNER_TEMP/lumine-spec-home" --github-env "$GITHUB_ENV"
      - name: Install editor dependencies
        working-directory: lumine
        run: npm ci --ignore-scripts
      - name: Download the Electron binary
        working-directory: lumine
        run: node script/install-electron.js
      - name: Rebuild native modules for Electron
        working-directory: lumine
        run: npm run build
      - name: Run the Jasmine spec suite
        working-directory: lumine
        timeout-minutes: 20
        run: xvfb-run --auto-servernum npm start -- --test ../ide-sofistik/spec
